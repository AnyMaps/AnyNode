[package]
name = "anynode"
version = "0.1.0"
edition = "2021"
description = "CLI tool for extracting PMTiles map data and uploading to Kubo (IPFS)"
license = "GPL-3.0-or-later"

[dependencies]
async-trait = "0.1"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
indicatif = "0.18"
tracing-indicatif = "0.3"

[dev-dependencies]
mockall = "0.14"
proptest = "1.10"
tempfile = "3.25"
assert_matches = "1.5"
wiremock = "0.6"
rstest = "0.25"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
# Prevent panics
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# Don't fail silently
let_underscore_must_use = "warn"
unused_result_ok = "warn"

# Async safety
await_holding_lock = "warn"
large_futures = "warn"

# Hygiene
dbg_macro = "warn"
