# Pre-commit: Fast checks (< 5s)
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt -- --check
    check:
      glob: "*.rs"
      run: cargo check --quiet 2>&1

# Pre-push: Thorough checks (< 30s)
pre-push:
  commands:
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings
    test:
      glob: "*.rs"
      run: cargo test --lib --quiet
